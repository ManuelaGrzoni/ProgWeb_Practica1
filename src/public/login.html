<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="container" style="max-width:420px; margin-top:3rem;">
    <div class="card">
      <h1 class="title">Login</h1>

      <form id="loginForm">
        <label>Email o usuario</label>
        <input id="emailOrUsername" class="input" required />

        <label>Contraseña</label>
        <input id="password" type="password" class="input" required />

        <button class="btn primary" type="submit" style="margin-top:1rem;">Entrar</button>
      </form>

      <p id="error" class="note error" hidden></p>

      <p class="note" style="margin-top:1rem;">
        ¿No tienes cuenta? <a href="/register.html">Registrarse</a>
      </p>
    </div>
  </main>

  <script src="/login.js"></script>
</body>
</html>
